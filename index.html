<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Envelope</title>

    <link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />

</head>
<body>

<div class="envlope-wrapper">
    <div id="envelope" class="close">
        <div class="front flap"></div>
        <div class="front pocket"></div>
        <div class="letter">
    <div class="letter-content">
        <div class="words main-text">
            <p>我能习惯远距离，</p>
            <p>爱总是身不由己，</p>
            <p>宁愿换个方式至少还能，</p>
            <p>遥远爱着你。</p>
        </div>

        <div class="words extra-text">
            <p>想说的话不会因为时差就过期。</p>
            <p>电话打不了，但烤串一直在。</p>
        </div>

        <div class="words signature">—— 爱来自你的好闺蜜</div>
    </div>
</div>
        <div class="hearts">
            <div class="heart a1"></div>
            <div class="heart a2"></div>
            <div class="heart a3"></div>
        </div>
    </div>
</div>
<div class="reset">
    <button id="open">Open Envelope</button>
    <button id="reset">Close Envelope</button>
</div>

 <div class="hearts"></div>

 <div id="confetti-container"></div>
<audio id="bgm" src="bgm.mp3" loop></audio>
<audio id="bgm" src="bgm.mp3" loop></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="script.js"></script>

</body>
</html>
